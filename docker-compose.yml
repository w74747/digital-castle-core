# docker-compose.yml (معدّل)
version: '3.9'

services:
  digital-castle:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATABASE_URL=postgresql://dc_user:dc_password@postgres:5432/digital_castle
      - REDIS_URL=redis://redis:6379
      - LOCALAI_URL=http://localai:8080
      - QWEN_URL=http://qwen:8000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/var/log/digital-castle
      - ./data:/app/data
    networks:
      - castle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  localai:
    image: localai/localai:latest
    ports:
      - "8080:8080"
    environment:
      - MODELS_PATH=/models
      - DEBUG=false
      - THREADS=4
    volumes:
      - ./models/localai:/models
      - ./cache/localai:/cache
    networks:
      - castle
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G

  qwen:
    build:
      context: .
      dockerfile: docker/Dockerfile.qwen
    ports:
      - "8001:8000"
    environment:
      - MODEL_NAME=qwen-3.8-27b
      - QUANTIZATION=gguf
      - THREADS=4
    volumes:
      - ./models/qwen:/models
      - ./cache/qwen:/cache
    networks:
      - castle
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: digital_castle
      POSTGRES_USER: dc_user
      POSTGRES_PASSWORD: dc_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - castle
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - castle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  castle:
    driver: bridge
