name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.10'

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          bandit[toml] \
          safety \
          semgrep

    # Bandit: Python security linter
    - name: Run Bandit security scan
      id: bandit
      continue-on-error: true
      run: |
        echo "## Bandit Security Scan Results" >> $GITHUB_STEP_SUMMARY
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -ll || echo "Bandit scan completed with warnings"

    # Safety: Check for known vulnerabilities in dependencies
    - name: Run Safety check
      id: safety
      continue-on-error: true
      run: |
        echo "## Safety Dependency Check Results" >> $GITHUB_STEP_SUMMARY
        safety check --json || echo "Safety check completed with warnings"

    # Semgrep: Pattern-based security scanning
    - name: Run Semgrep scan
      id: semgrep
      continue-on-error: true
      run: |
        semgrep --config=p/security-audit app/ --json -o semgrep-report.json || true
        semgrep --config=p/security-audit app/ || echo "Semgrep scan completed"

    # Check for hardcoded secrets
    - name: Detect secrets with TruffleHog
      id: secrets
      continue-on-error: true
      run: |
        pip install truffleHog
        trufflehog filesystem . --json --only-verified || echo "Secret scan completed"

    # Check for dependency vulnerabilities
    - name: Check Python dependencies
      id: pip-audit
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit || echo "Pip audit completed with warnings"

    # Check environment variables for secrets
    - name: Verify no secrets in .env.example
      run: |
        if grep -E "(real_|actual_|test_|example_|=\S{32,})" .env.example; then
          echo "⚠️ WARNING: Possible hardcoded values in .env.example"
        else
          echo "✅ .env.example looks clean"
        fi

    # OWASP dependency check
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      id: dependency-check
      continue-on-error: true
      with:
        project: 'Digital Castle'
        path: '.'
        format: 'JSON'
        args: >
          --enableExperimental
          --enableVulnerability
          --scan .

    # Upload all security reports
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          semgrep-report.json
          dependency-check-report.json
        retention-days: 90

    # Create summary
    - name: Create security summary
      if: always()
      run: |
        echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Bandit:** $(grep -o '\"severity\": \"MEDIUM\"\|\"severity\": \"HIGH\"' bandit-report.json | wc -l) issues" >> $GITHUB_STEP_SUMMARY
        echo "**Safety:** Check dependency vulnerabilities ✓" >> $GITHUB_STEP_SUMMARY
        echo "**Semgrep:** Pattern-based scanning ✓" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    # Fail job if high-severity issues found
    - name: Check for critical security issues
      if: always()
      run: |
        CRITICAL=$(grep -c '"severity": "HIGH"' bandit-report.json || echo 0)
        if [ $CRITICAL -gt 0 ]; then
          echo "❌ Found $CRITICAL critical security issues"
          exit 1
        else
          echo "✅ No critical security issues found"
        fi

  dependency-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check Python package versions
      run: |
        echo "## Dependency Versions" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        pip install -r requirements.txt
        pip list | grep -E "(anthropic|httpx|telegram|sqlalchemy|playwright)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
