name: Test on Push

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.10'
  CACHE_VERSION: v1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: digital_castle_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          postgresql-client \
          libpq-dev \
          build-essential

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Download Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps

    - name: Create test database
      env:
        PGPASSWORD: test_password
      run: |
        psql -h localhost -U test_user -d digital_castle_test -c "SELECT 1;" || \
        psql -h localhost -U test_user -c "CREATE DATABASE digital_castle_test;"

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/digital_castle_test
        APP_ENV: test
      run: |
        alembic upgrade head

    - name: Lint with flake8
      continue-on-error: true
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type checking with mypy
      continue-on-error: true
      run: |
        mypy app --ignore-missing-imports

    - name: Run pytest with coverage
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/digital_castle_test
        TELEGRAM_BOT_TOKEN: fake_token_for_testing
        TELEGRAM_ADMIN_ID: 123456789
        ANTHROPIC_API_KEY: fake_key_for_testing
        DEEPSEEK_API_KEY: fake_key_for_testing
        TOGETHER_API_KEY: fake_key_for_testing
        GITHUB_TOKEN: fake_token_for_testing
        APP_ENV: test
        DEBUG: "False"
      run: |
        pytest tests/ \
          -v \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --tb=short

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 75
        MINIMUM_ORANGE: 50

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          htmlcov/
          .coverage
        retention-days: 30

    - name: Comment PR with test status
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          let comment = '## Test Results\n\n';
          
          if (context.payload.pull_request) {
            comment += '✅ Tests passed!\n\n';
            comment += '📊 **Coverage Report**: [View Here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] safety

    - name: Run Bandit security scan
      continue-on-error: true
      run: |
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -f txt

    - name: Run Safety check
      continue-on-error: true
      run: |
        safety check --json || true

    - name: Upload security results
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30
